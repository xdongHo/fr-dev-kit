  frontend_api:   # 前端 API 方言（L6 真机实测 119 断言为准；R26 2026-09-05 合入 MIS-15 P0）
    widgets:
      view_page_access: 'contentPane.parameterEl.getWidgetByName(name) 是唯一验证路径；contentPane.getWidgetByName 在 cpt 查看页不存在（PM11R2）'
      enumerate: 'Object.keys(parameterEl.name_widgets||{}) 枚举全部控件名；getWidgetsAll() 在 FR10 不存在（PM13，web_kit _JS_VALIDATION 需改）'
      anonymous_cell_widget: '填报页匿名控件唯一途径 contentPane.getWidgetByCell("C6")——只收列字母+1基行号字符串，传数字抛 str.match TypeError（TOP1）'
