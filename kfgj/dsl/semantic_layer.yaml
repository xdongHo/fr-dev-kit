      parameter_el_not_jquery: 'parameterEl 是参数容器对象非 jQuery，无 .width()；面板坐标走 DOM .parameter-container（TOP3）'
    dialog:   # （MIS-16；无头+有头双验 MSG03R2/DLG03R2/DLG04R2）
      msg_alert_family: 'FR.Msg.alert/confirm/prompt 本构建静默无效（无窗口无回调无 JS 错）——轻提示用 FR.Msg.toast（可用），弹窗用 new FR.Dialog({title,contentHtml})+setVisible(true)'
      dialog_content: 'FR.Dialog.setContent 首次与重新 setVisible 后均不生效——内容走构造参数 contentHtml 一次给足（DLG03R2）'
      dialog_close: 'doClose 后根节点仍 display=block——关闭用 setVisible(false)，移除用 element.remove()（DLG04R2）'
