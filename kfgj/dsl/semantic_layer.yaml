# ────────────────────────── 组织与权限（§五.1/§五.2）──────────────────────────
org:
  cascade_fields: [legal_code, bu, region, plant_code]
  cascade_params: [para_legal, para_bu, para_region, para_plant]
  entity_note: entity = legal_code/bu/region/plant_code 四字段并集；entity 控件只读公式=最细颗粒度
  cascade_cond_template: |
    ('${para_legal}'='' OR f.legal_code='${para_legal}') AND ('${para_bu}'='' OR f.bu='${para_bu}') AND ('${para_region}'='' OR f.region='${para_region}') AND ('${para_plant}'='' OR f.plant_code='${para_plant}')
  entity_union_template: |
    entity IN (
        SELECT legal_code FROM demo_ads.fin_demo_auth_base_info f WHERE {cascade_cond}
        UNION ALL SELECT bu FROM demo_ads.fin_demo_auth_base_info f WHERE {cascade_cond}
        UNION ALL SELECT region FROM demo_ads.fin_demo_auth_base_info f WHERE {cascade_cond}
        UNION ALL SELECT plant_code FROM demo_ads.fin_demo_auth_base_info f WHERE {cascade_cond})
  dsfs_org_whitelist:   # T2-CI-ORG 新增（2026-09-07 用户口径②）：ds_fs 专用无条件 ORG 白名单，用户 SQL 原文收录
    snapshot_at: '2026-09-07'
    note: '与 entity_union_template 的区别：无 cascade_cond（不受 para_legal/bu/region/plant 级联影响），纯四列并集；作为独立 AND 加在 ds_fs 各含 entity 的 CTE 的 WHERE 顶层（管理员亦受限=组织数据域边界，非用户权限）'
    sql: |
      AND entity IN (
        SELECT legal_code FROM demo_ads.fin_demo_auth_base_info
        UNION ALL SELECT bu FROM demo_ads.fin_demo_auth_base_info
        UNION ALL SELECT region FROM demo_ads.fin_demo_auth_base_info
        UNION ALL SELECT plant_code FROM demo_ads.fin_demo_auth_base_info
      )
    applied: '示例预算表.cpt ds_fs 14 CTE（py/cur/cur_bud/bud/ext1-5/fy1-5）+ 示例实际表.cpt ds_fs 4 CTE（py/cur/bud/ext1）；主查询 account 骨架子查询无 entity 维度未加（D2 披露）'
  perm_template: |
    (EXISTS(SELECT 1 FROM demo_ads.fin_demo_config_user_role WHERE role_id IN ('0','1') AND user_gid='${fine_username}') OR entity IN (SELECT plant_code FROM demo_ads.fin_demo_auth_base_user_map WHERE user_gid='${fine_username}'))
  perm_on_alias_template: |
    (EXISTS(SELECT 1 FROM demo_ads.fin_demo_config_user_role WHERE role_id IN ('0','1') AND user_gid='${fine_username}') OR {alias}.entity IN (SELECT plant_code FROM demo_ads.fin_demo_auth_base_user_map WHERE user_gid='${fine_username}'))
  perm_exists_alias_template: |
    ((EXISTS(SELECT 1 FROM demo_ads.fin_demo_config_user_role WHERE role_id IN ('0','1') AND user_gid='${fine_username}')) OR EXISTS(SELECT 1 FROM demo_ads.fin_demo_auth_base_user_map m WHERE m.user_gid='${fine_username}' AND m.plant_code={alias}.plant_code))
  perm_variants:   # 权限家族变体（MIS-10；G3/G4 豁免裁决状态=待业务裁决，见 R12/R26 REPORT 待问题）
    standard: 'perm_template（EXISTS 角色 OR entity 四段并集）——FS 主表/下钻族'
    vave: 'EXISTS(角色0/1) OR EXISTS(user_map.plant_code=COALESCE(pm.entity_desc, v.production_plant))；无 auth_base_info 四段并集（G3 org_markers 拦点，基线 示例模块 1~3）'
    sustainability: 'ds_sus 全 SQL 无 ORG/PERM（基线 Sustainability 1~3）；BPC 取数页是否豁免权限闸待业务裁决（L10 待问题2）'
    gate_policy: 豁免裁决定性前，G3/G4 对非标准族报 WARN 不阻断
  dict_dependencies:
    dict_legal: []
    dict_bu: [para_legal]
    # S6 修正（R33 2026-09-05，R26 执行）：原断言 [para_legal, para_bu] 被线上证伪——全部 dict_region SQL 只依赖
    # para_bu（R33 dict_sql_extracted.txt 8 页逐条核对），legal→region 直联级联实际不存在。按"改知识"方向修正；
    # 是否改线上 SQL 补 para_legal 属另一向裁决（R33 待问题7）。compile.py dict_region 片段 WHERE 本就只滤 para_bu，
    # 但其 dict_block 声明仍硬编码 ['para_legal','para_bu']——编译器侧对齐留作改进项（见 R26 REPORT 发现节）。
    dict_region: [para_bu]
    dict_plant: [para_legal, para_bu, para_region]

# ────────────────────── 约定（§五.3~§五.6 + §六 + §七）─────────────────────
conventions:
  needs_clarification:   # G0 前置闸约定（T11 spec-kit 内联歧义标记；2026-09-06 CAR-012 合入）
    declaration_note: 本节点=约定声明非实例，扫描器按路径 conventions.needs_clarification 跳过，勿在此节点下放真实待澄清槽位
    rule: |
      任意槽位可标歧义：page DSL 或本语义层的任意映射内加同级键（键名见下方 sibling_key 形态），
      值为澄清问题（接受 str / {question,context} / 列表）；或在任意字符串值内写 spec-kit 内联式标记（见 inline_value）。
      compile.py 装载两份 yaml 后、grounding 之前扫描：存在任一标记→拒绝产出 cpt、列澄清问题清单、
      退出码 3（既有 0=成功/1=编译失败/2=缺依赖 语义不变）。语义=歧义显式化前置闸：未消歧不得实现
      （clarify 未过不能 plan）；消歧后删除标记重编译。
    forms:
      sibling_key: 'needs_clarification（键）: 澄清问题文本'
      inline_value: '任意字符串值内 [NEEDS CLARIFICATION: 澄清问题文本]'
  control_param_rule: FR 控件 WidgetName 必须等于模板参数名（para_xxx），否则值不绑定（踩过坑）
  widget_name_xml_rule: |
    控件名必须落子元素 <Widget class="..."><WidgetName name="para_x"/></Widget>；
    widgetName="x" 属性写法 FR 解析器静默丢弃且不报错（L2 2026-09-04 实测，base_填报_ScenarioMapping.cpt）。
    compile.py 控件模板按子元素生成；guardrails 应对属性写法出 ERROR（新检项候选）。
    （MIS-02 P0，R26 2026-09-05 合入）
  control_param_fact: |
    主表合规（控件全 para_*）。下钻页 v2 生成器违例：控件名 legal/bu/region/plant/entity（无 para_ 前缀），
    锁定 JS 却引用 para_legal 等且被 try/catch 静默吞掉 → 锁定失效、面板选择不回灌 ${para_*}，页面取值全靠主表超链 URL 继承。
    fr_check doc-157 对此的报错是真阳性（曾被当基线误报）。compile.py 产物一律 para_* 控件名（修复项，对拍时为可接受差异）。
  param_registration_forms:   # 参数注册三形态（MIS-01，Sustainability.cpt 实测 2026-09-04；R26 合入）
    declared: ReportParameterAttr 声明（FS 主表形态）
    widget_binding: 控件 WidgetName=参数名（panel_org 形态）
    param_guard_dataset: |
      无面板页面注册通道：SELECT ${para_ver} AS v, ${para_year} AS y, ${para_month} AS m
      （FR 以数据集形式在会话内注册参数供其他数据集引用；Sustainability.cpt 实测 2026-09-04）
      豁免前缀 param_guard 已在 sql_exceptions，其参数名 para_ver 已同步补入 standard_params（随 MIS-11）
  standard_params: [p_code, p_name, para_legal, para_bu, para_region, para_plant, para_entity,
                    para_year, para_month, para_month_bud, para_scn_py, para_scn_bud, para_scn_cur,
                    para_adj, para_curr, para_unit, para_ext1, para_ext2, para_ext3, para_ext4, para_ext5,
                    para_ver, para_data_year]   # para_ver=Sustainability param_guard 注册；para_data_year=示例模块 面板（MIS-11，R26 补）
  main_table_notes:   # 2026-09-04 主表实测（Agent-1 结构卡）
    - para_adj 有控件且被 ds_fs 引用，但未在 ReportParameterAttr 声明（运行期靠控件名补参）
    - 列显隐用 HighlightList + ColWidthHighlightAction（2932 条 Condition），非 ConditionAttr
    - RowHeight defaultValue=723900（887 项），r0~r4=1440000；转接文档"r3 表头 508000"已过时
    - ds_fs = 4 CTE（py/cur/bud/ext1），权限子句逐字重复 4 次；EXISTS(角色) OR entity IN(用户映射) AND entity IN(四段并集)
      —— 按 precedence 即 管理员旁路组织过滤，普通用户需 同时命中用户映射与组织并集
  listener_event: change        # 控件编辑事件；若不触发再试 afteredit
  period_rule: dws 表 period 存数字串 '1'~'12'，FR 参数是 'Sep' 之类，SQL 必须 CASE upper() 转换
  period_case_template: |
    (CASE upper('${para_month}') WHEN 'JAN' THEN '1' WHEN 'FEB' THEN '2' WHEN 'MAR' THEN '3' WHEN 'APR' THEN '4' WHEN 'MAY' THEN '5' WHEN 'JUN' THEN '6' WHEN 'JUL' THEN '7' WHEN 'AUG' THEN '8' WHEN 'SEP' THEN '9' WHEN 'OCT' THEN '10' WHEN 'NOV' THEN '11' WHEN 'DEC' THEN '12' END)
  numeric_cast_template: "COALESCE(NULLIF({col},'')::numeric,0)"
  column_criteria:
    budget_cur: 读 sum_budget 且 scenario=upper('${para_scn_cur}')（预测/滚动，非实际）
    actual_cur: 走 ADJ 视图，CASE '${para_adj}' WHEN 'ADJ后' THEN ytd_post ELSE ytd_orig END
    actual_bud_period: "'12'"          # 示例实际表页预算列固定 Dec
    budget_bud_period_param: para_month_bud
    standard_filters: "view='YTD' AND value='CNY'"
  ci_project_view_scope: |
    2026-09-09 起 demo_ads.fin_demo_view_demob_ci 视图口径收窄：原定义(UNION体)外包一层
    SELECT * FROM (...) t WHERE t.special_initiatives LIKE '%影响PL%'，行数 9919→4664，
    65 列名/顺序/类型零变化。影响面：明细报表/CI Project.cpt 全部 6 个引用该视图的数据集
    （ds0 主取数 WITH v AS (SELECT * FROM 视图)、ds1 明细、ds7/9/10/11 字典）随视图同步收窄；
    页面渲染实测 312 页×~15 行≈4664。改前原定义备份=_runs/t2demob_view_original.sql，
    回滚=直接执行该文件的 CREATE OR REPLACE VIEW。
  plant_map_entity_desc: |
    口径事实（2026-09-12 二次纠偏，zcode-agent30；推翻同日 zcode-agent29 的 entity_desc 英文化）：
    ① entity_desc = 组织架构表中文描述（回滚已执行：104 行恢复原值，119/119 与改前备份
    _runs/t2pmap_backup_20260909.csv 逐行一致，0 行残留英文 CI 值；其中泰国×4/印度/MTY×2
    共 7 行原值本就是英文，属组织架构原状）。entity_desc 为纯显示列，不参与任何 join。
    ② src_plant = CI 英文 sub_region（stg_bdp.v_demob_ci_tmp2_zhs.sub_region 值域），作用=让
    fin_demo_view_demob_ci 的 map join（map.src_plant=CI.sub_region + auth.plant_code=map.entity_id）
    命中。⚠ 表上有部分唯一索引 ux_demob_plant_map_plant ON(src_plant) WHERE delete_flag=1——
